# Small draft model for speculative decoding: same tokenizer, 2 layers.
name: draft
model: {vocab_size: 4096, d_model: 128, n_layers: 2, n_heads: 4, max_seq_len: 512}
data: {seq_len: 128}
optim: {lr: 3.0e-3, warmup_steps: 50}
train: {steps: 1500, micro_batch_size: 32, grad_accum: 1, eval_every: 100, eval_batches: 16, checkpoint_every: 500, log_every: 25}
mlflow: true
