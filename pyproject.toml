[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmlab"
version = "0.1.0"
description = "Reproducible LLM systems lab: single-device/DDP/FSDP2 training, checkpoint-resume, and a from-scratch inference engine with paged KV cache, continuous batching, prefix caching, speculative decoding and int8 quantization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Denis Samatov" }]
dependencies = [
  "torch>=2.6",
  "numpy>=1.26",
  "tokenizers>=0.20",
  "pydantic>=2.7",
  "pyyaml>=6",
  "psutil>=5.9",
]

[project.optional-dependencies]
lora = ["peft>=0.13", "transformers>=4.45", "scikit-learn>=1.5"]
tracking = ["mlflow>=3.0"]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llmlab = "llmlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: multi-process or training tests (minutes on CPU)",
  "gpu: requires CUDA; never counted as passed on CPU runners",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
